name: Release & Distribution

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build Standalone Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            bin: lory-linux-amd64
          - goos: linux
            goarch: arm64
            bin: lory-linux-arm64
          - goos: darwin
            goarch: amd64
            bin: lory-darwin-amd64
          - goos: darwin
            goarch: arm64
            bin: lory-darwin-arm64
          - goos: windows
            goarch: amd64
            bin: lory-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile Standalone Zero-Dependency Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o dist/${{ matrix.bin }} apps/cli/main.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}
          path: dist/${{ matrix.bin }}

  publish-docker-worker:
    name: Publish Worker Container Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Worker Container
        uses: docker/build-push-action@v5
        with:
          context: apps/worker
          push: true
          tags: |
            ghcr.io/lorikeetsecurity/lory-worker:latest
            ghcr.io/lorikeetsecurity/lory-worker:${{ github.ref_name }}

  publish-npm:
    name: Publish NPM CLI Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @lorikeetsecurity/lory
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm publish --access public apps/cli || true
